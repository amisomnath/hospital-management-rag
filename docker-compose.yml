services:
  db:
    image: pgvector/pgvector:pg17
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
      POSTGRES_USER: ${POSTGRES_USER:-hospital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital_user} -d ${POSTGRES_DB:-hospital_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hospital_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hospital_db}
      EMBEDDING_DEVICE: ${DOCKER_EMBEDDING_DEVICE:-cpu}
      VECTOR_INDEX_PATH: /app/storage/vector_index/hospital.index
      VECTOR_METADATA_PATH: /app/storage/vector_index/metadata.json
      VECTOR_NUMPY_PATH: /app/storage/vector_index/hospital_vectors.npz
    volumes:
      - vector_data:/app/storage/vector_index
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  vector_data:
  hf_cache:
